version: "3.8"


services:
    manytask:
        build:
            dockerfile: Dockerfile
            context: .
        container_name: manytask
        environment:
            FLASK_DEBUG: 1
        ports:
            - "5050:5050"
        volumes:
            - ./app.config.yaml:/app/app.config.yaml:ro
            - ./manytask/:/app/manytask
            - .tmp/cache/:/cache
            - .tmp/solutions/:/solutions
